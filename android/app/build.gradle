plugins { id 'com.android.application' }

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) { localPropsFile.withInputStream { localProps.load(it) } }

android {
    namespace 'se.gunning.valhalla'
    compileSdk 34
    defaultConfig {
        applicationId 'se.gunning.valhalla'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
        // Override with: ./gradlew assembleDebug -PserverUrl=http://192.168.1.10:8080/
        buildConfigField 'String', 'SERVER_URL', "\"${project.findProperty('serverUrl') ?: 'https://gunning.se/Valhallasc/'}\""
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            // Keystore path/passwords come from local.properties (gitignored), not the repo.
            if (localProps.getProperty('release.storeFile')) {
                storeFile file(localProps.getProperty('release.storeFile'))
                storePassword localProps.getProperty('release.storePassword')
                keyAlias localProps.getProperty('release.keyAlias')
                keyPassword localProps.getProperty('release.keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (localProps.getProperty('release.storeFile')) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "Valhalla-${variant.versionName}.apk"
        }
    }
}
